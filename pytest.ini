[pytest]
# anyio (pulled in transitively by the `mcp` pip package used by okf_robotics_mcp)
# registers a global pytest plugin that assumes a newer pytest than Ubuntu Jammy's
# python3-pytest ships (it imports _pytest.scope, added after this apt version).
# None of these tests use anyio's plugin, so disable it rather than upgrading pytest.
addopts = -p no:anyio
